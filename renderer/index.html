<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>我的笔记</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>我的笔记</h1>
        <div class="sidebar-actions">
          <button id="new-note">新建</button>
        </div>
      </div>
      <ul id="note-list"></ul>
    </aside>

    <main class="editor">
      <div class="editor-header">
        <input id="note-name" placeholder="笔记标题（文件名）">
        <button id="save-note">保存</button>
        <button id="ocr-file">插入图片并识别</button>
        <button id="ocr-clipboard">从剪贴板识别</button>
      </div>
      <input type="file" id="ocr-file-input" accept="image/png,image/jpeg" hidden>
      <div class="editor-body">
        <textarea id="editor" placeholder="在这里写 Markdown..."></textarea>
        <div id="preview" class="preview"></div>
      </div>
    </main>
  </div>

  <div id="toast">已保存</div>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="note-store.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
