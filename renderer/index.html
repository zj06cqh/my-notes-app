<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>我的笔记</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <h1>我的笔记</h1>
          <span class="sidebar-subtitle">本地 · Markdown</span>
        </div>
        <button id="new-note" class="btn btn-primary" title="新建笔记">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>新建</span>
        </button>
      </div>
      <ul id="note-list"></ul>
    </aside>

    <main class="editor">
      <div class="editor-header">
        <input id="note-name" placeholder="笔记标题（文件名）" spellcheck="false">
        <button id="save-note" class="btn btn-secondary" title="保存（Ctrl+S）">
          <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
          <span>保存</span>
        </button>
        <div class="toolbar-divider"></div>
        <button id="ocr-file" class="btn btn-ghost" title="插入图片并识别">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span>识别图片</span>
        </button>
        <button id="ocr-clipboard" class="btn btn-ghost" title="从剪贴板识别">
          <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          <span>剪贴板识别</span>
        </button>
      </div>
      <input type="file" id="ocr-file-input" accept="image/png,image/jpeg" hidden>
      <div class="editor-body">
        <textarea id="editor" placeholder="在这里写 Markdown..." spellcheck="false"></textarea>
      </div>
    </main>
  </div>

  <div id="toast">已保存</div>

  <script src="note-store.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
